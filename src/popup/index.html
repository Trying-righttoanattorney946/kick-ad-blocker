<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kick Ad Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img
        class="brand-mark"
        src="../../icons/icon128.png"
        alt=""
        width="44"
        height="44"
      />
      <span class="brand-text">
        <span class="brand-name">Kick Ad Blocker</span>
        <span class="brand-tagline">Stream ads, skipped for you</span>
      </span>
    </header>

    <label class="protection-switch">
      <span id="protectionLabel" class="protection-label">Protection on</span>
      <input
        id="protectionToggle"
        class="toggle"
        type="checkbox"
        checked
        aria-label="Enable ad protection"
      />
    </label>

    <div class="stats">
      <div class="stat">
        <span id="adsSkippedValue" class="stat-value">0</span>
        <span class="stat-label">Ads skipped</span>
      </div>
      <div class="stat">
        <span id="blockedNetworksValue" class="stat-value">0</span>
        <span class="stat-label">Networks blocked</span>
      </div>
    </div>

    <footer class="footer">
      <span class="activity">
        <span id="activityIndicator" class="activity-indicator is-live"></span>
        <span id="activityLabel">Watching for ads</span>
      </span>
      <a
        id="repositoryLink"
        class="source-link"
        target="_blank"
        rel="noopener noreferrer"
        >Source &#8599;</a
      >
    </footer>

    <script src="../shared/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
