name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['manifest.json', 'rules/ad-networks.json']) {
              JSON.parse(fs.readFileSync(file, 'utf8'));
            }
          "

      - name: Verify manifest references resolve
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const referenced = [
              ...Object.values(manifest.icons),
              ...Object.values(manifest.action.default_icon),
              manifest.action.default_popup,
              manifest.background.service_worker,
              ...manifest.content_scripts.flatMap((script) => script.js),
              ...manifest.declarative_net_request.rule_resources.map((r) => r.path),
            ];
            for (const path of referenced) fs.accessSync(path);
          "
